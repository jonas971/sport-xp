<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SportXP – Simulation</title>
<style>
  @font-face{font-family:"Barlow Condensed";font-weight:600;src:url(fonts/BarlowCondensed-SemiBold.ttf)}
  @font-face{font-family:"Barlow Condensed";font-weight:700;src:url(fonts/BarlowCondensed-Bold.ttf)}
  @font-face{font-family:"Barlow Condensed";font-weight:800;src:url(fonts/BarlowCondensed-ExtraBold.ttf)}
  @font-face{font-family:"Nunito";font-weight:200 1000;src:url(fonts/Nunito-Variable.ttf)}
  :root{
    --ink:#17233F;      /* bleu nuit : texte, bandeau */
    --ink-2:#2A3A60;
    --flame:#FF6B1A;    /* action principale, série */
    --flame-d:#D9530A;
    --volt:#FFC93C;     /* XP */
    --mint:#22B573;     /* réussite */
    --chalk:#EEF1F6;    /* fond */
    --line:#DCE1EA;
    --mute:#6B768C;
    --red:#E5484D;
    --card:#FFFFFF;
    --display:"Barlow Condensed",system-ui,sans-serif;
    --body:"Nunito",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--body);background:#C9D1DE;color:var(--ink);min-height:100vh;display:flex;gap:32px;justify-content:center;align-items:flex-start;padding:28px 16px;flex-wrap:wrap}
  button{font-family:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--flame);outline-offset:2px}
  .ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .ico.fill{fill:currentColor;stroke:none}

  /* ---------------- panneau de simulation ---------------- */
  .panel{width:340px;background:#fff;border-radius:20px;padding:22px;box-shadow:0 12px 40px rgba(23,35,63,.18)}
  .panel h1{font-family:var(--display);font-size:28px;font-weight:800;margin:0 0 4px;letter-spacing:.2px}
  .panel .sub{color:var(--mute);font-size:13.5px;margin:0 0 16px;line-height:1.45}
  .clock{background:var(--ink);color:#fff;border-radius:14px;padding:14px;text-align:center;margin-bottom:12px}
  .clock .d{font-size:14px;opacity:.75;text-transform:capitalize}
  .clock .t{font-family:var(--display);font-size:52px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .pbtn{border:1.5px solid var(--line);border-radius:12px;padding:10px;font-weight:700;font-size:14px;cursor:pointer;background:#fff}
  .pbtn:hover{border-color:var(--ink)}
  .pbtn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
  .pbtn.warn{color:var(--red)}
  .next{font-size:13.5px;background:var(--chalk);border-radius:10px;padding:10px 12px;margin-bottom:12px;line-height:1.5}
  .log{max-height:280px;overflow:auto;border-top:1px solid var(--line);padding-top:8px}
  .log h3{font-size:14px;margin:4px 0 6px;color:var(--mute)}
  .log div{font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line);line-height:1.4}
  .log .tm{color:var(--mute);font-variant-numeric:tabular-nums;margin-right:6px}

  /* ---------------- téléphone ---------------- */
  .phone{width:380px;height:790px;background:#0E1526;border-radius:48px;padding:11px;box-shadow:0 24px 60px rgba(23,35,63,.45);position:relative;flex-shrink:0}
  .screen{width:100%;height:100%;background:var(--chalk);border-radius:38px;overflow:hidden;position:relative;display:flex;flex-direction:column}
  .status{height:34px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:13px;font-weight:800;flex-shrink:0}
  .screen.dark-top .status{background:var(--ink);color:#fff}
  .content{flex:1;overflow-y:auto;overflow-x:hidden}
  .pad{padding:16px}
  .nav{display:flex;background:#fff;border-top:1px solid var(--line);flex-shrink:0;padding:6px 6px 12px}
  .nav button{flex:1;border:0;background:none;padding:6px 0 2px;cursor:pointer;font-size:11.5px;font-weight:700;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px}
  .nav button.on{color:var(--ink)}
  .nav button.on .ico{color:var(--flame)}

  /* bandeau du jour */
  .hero{background:var(--ink);color:#fff;padding:6px 18px 20px;position:relative;border-radius:0 0 26px 26px}
  .hero .top{display:flex;justify-content:space-between;align-items:center}
  .streak{display:flex;align-items:center;gap:8px}
  .streak .num{font-family:var(--display);font-size:64px;font-weight:800;line-height:.9}
  .streak .lbl{font-size:14px;font-weight:700;opacity:.8;line-height:1.15}
  .streak .ico{width:40px;height:40px;color:var(--flame)}
  .streak.cold .ico{color:#5A6A8E}
  .pills{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .pill{display:inline-flex;align-items:center;gap:5px;background:var(--ink-2);border-radius:20px;padding:4px 10px 4px 7px;font-weight:800;font-size:13px}
  .pill .ico{width:16px;height:16px}
  .pill.xp .ico{color:var(--volt)}
  .pill.jk .ico{color:#7FB2FF}
  .lvl{margin-top:12px;font-size:13px;font-weight:700;opacity:.9;display:flex;justify-content:space-between}
  .bar{height:8px;background:var(--ink-2);border-radius:4px;overflow:hidden;margin-top:6px}
  .bar>div{height:100%;background:var(--volt);border-radius:4px;transition:width .6s}
  .week{display:flex;justify-content:space-between;margin-top:16px}
  .wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:700;opacity:.85;width:38px}
  .wd .dot{width:30px;height:30px;border-radius:50%;border:2px solid #3B4C74;display:flex;align-items:center;justify-content:center}
  .wd .dot.rest{border-style:dashed;border-color:#3B4C74}
  .wd .dot.done{background:var(--flame);border-color:var(--flame)}
  .wd .dot.joker{background:#7FB2FF;border-color:#7FB2FF}
  .wd .dot .ico{width:16px;height:16px;color:#fff}
  .wd.today{opacity:1}
  .wd.today .dot{box-shadow:0 0 0 3px var(--ink),0 0 0 5px #fff}

  /* coach */
  .coach{display:flex;align-items:flex-end;gap:6px;margin:12px 16px 10px;position:relative}
  .coach .m{flex-shrink:0;width:78px}
  .bub{background:#fff;border-radius:18px 18px 18px 4px;padding:11px 13px;font-size:14.5px;font-weight:600;line-height:1.38;box-shadow:0 2px 0 var(--line);margin-bottom:8px}
  .coach.plain{margin:0 0 14px}

  /* séance */
  .sess{background:#fff;border-radius:22px;padding:16px;margin:0 16px 14px;box-shadow:0 2px 0 var(--line)}
  .sess .kind{font-size:13px;font-weight:700;color:var(--mute)}
  .sess h2{font-family:var(--display);font-size:36px;font-weight:800;margin:0;line-height:1}
  .meta{display:flex;gap:14px;margin:8px 0 6px;font-size:13px;font-weight:700;color:var(--mute);flex-wrap:wrap}
  .meta span{display:inline-flex;align-items:center;gap:4px}
  .meta .ico{width:16px;height:16px}
  .diff{display:inline-flex;gap:2px;align-items:flex-end}
  .diff i{width:4px;border-radius:1px;background:var(--line)}
  .diff i:nth-child(1){height:6px}.diff i:nth-child(2){height:10px}.diff i:nth-child(3){height:14px}
  .diff i.on{background:var(--flame)}
  .exr{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--chalk);cursor:pointer}
  .exr:first-of-type{border-top:0}
  .exr .mb{width:30px;flex-shrink:0}
  .exr .n{font-weight:800;font-size:15px;line-height:1.2}
  .exr .a{font-size:13px;color:var(--mute);font-weight:600}
  .exr .go{color:var(--mute)}
  .seg{display:flex;background:var(--chalk);border-radius:12px;padding:3px;margin:4px 0 10px}
  .seg button{flex:1;border:0;background:none;border-radius:10px;padding:7px;font-weight:800;font-size:13px;cursor:pointer;color:var(--mute)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 0 var(--line)}
  .cta{width:100%;height:56px;border:0;border-radius:16px;background:var(--flame);color:#fff;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--flame-d);display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--body)}
  .cta:active{transform:translateY(2px);box-shadow:0 2px 0 var(--flame-d)}
  .cta:disabled{background:#C8CFDB;box-shadow:0 4px 0 #AEB7C6;cursor:not-allowed}
  .cta.ink{background:var(--ink);box-shadow:0 4px 0 #0A1226}
  .cta.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:1.5px solid var(--line)}
  .note{font-size:13px;color:var(--mute);text-align:center;margin:10px 16px 18px;font-weight:600}
  .done-banner{display:flex;gap:10px;align-items:center;background:#E3F7EE;color:#106B44;border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px;margin-bottom:10px}
  .done-banner .ico{color:var(--mint)}

  /* écrans génériques */
  h1.t{font-family:var(--display);font-size:34px;font-weight:800;margin:4px 0 2px;line-height:1}
  .lead{color:var(--mute);font-size:14.5px;margin:4px 0 14px;line-height:1.45;font-weight:600}
  .sec{font-family:var(--display);font-weight:800;font-size:22px;margin:20px 0 8px}
  .card{background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 2px 0 var(--line)}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}
  .small{font-size:13px;color:var(--mute);font-weight:600}
  .switch{width:48px;height:28px;border-radius:14px;background:#C8CFDB;position:relative;cursor:pointer;flex-shrink:0;border:0;transition:background .2s}
  .switch::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s}
  .switch.on{background:var(--mint)}.switch.on::after{left:23px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font-size:13.5px;font-weight:700;cursor:pointer}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .daybtns{display:flex;gap:5px}
  .daybtns button{flex:1;height:40px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:800;cursor:pointer;font-size:14px}
  .daybtns button.on{background:var(--flame);border-color:var(--flame);color:#fff}
  .lnk{color:var(--ink);font-weight:800;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:13.5px;background:none;border:0;padding:0}
  .plan{display:flex;flex-direction:column;gap:6px}
  .plan .pd{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:9px 12px;box-shadow:0 1px 0 var(--line)}
  .plan .pd b{width:34px;font-family:var(--display);font-size:18px}
  .plan .pd.rest{background:transparent;box-shadow:none;border:1.5px dashed var(--line);color:var(--mute)}
  .why{background:#FFF3E8;border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.5;font-weight:600;color:#5B3416;margin-top:10px}
  .lib{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--chalk);cursor:pointer}
  .slot{display:flex;align-items:center;gap:8px;background:var(--chalk);border-radius:10px;padding:6px 6px 6px 10px;margin-top:6px}
  .slot .hrs{font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
  .x{border:0;background:#fff;color:var(--red);border-radius:8px;width:30px;height:30px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .x .ico{width:16px;height:16px}
  .tag{font-size:11px;background:#FFE3CF;color:#9A3F06;border-radius:6px;padding:1px 6px;font-weight:800;margin-left:4px}
  .paused{opacity:.5}

  /* onboarding */
  .dots{display:flex;gap:5px;margin:6px 0 14px}.dots span{flex:1;height:6px;border-radius:3px;background:var(--line)}.dots span.on{background:var(--flame)}
  .back{display:inline-flex;align-items:center;gap:2px;border:0;background:none;font-weight:800;color:var(--mute);cursor:pointer;padding:0;margin-bottom:6px;font-size:14px}
  .back .ico{width:18px;height:18px}
  .pick2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 18px}
  .pickc{border:2px solid var(--line);background:#fff;border-radius:20px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;text-align:center;font-size:14px}
  .pickc b{font-size:15.5px}
  .pickc.on{border-color:var(--flame);box-shadow:0 3px 0 var(--flame)}
  .opt{display:flex;gap:12px;align-items:center;border:2px solid var(--line);background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left}
  .opt.on{border-color:var(--flame);box-shadow:0 3px 0 var(--flame)}
  .opt b{font-size:16px;display:block}
  .opt .gl{width:42px;height:42px;border-radius:12px;background:var(--chalk);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .opt.on .gl{background:#FFE3CF;color:var(--flame-d)}
  .sexfig{height:120px}
  .mz{cursor:pointer;transition:fill .15s}
  .mz:hover{fill:#8E99AB}
  .mz.on:hover{fill:var(--flame-d)}

  /* calques */
  .overlay{position:absolute;inset:0;background:rgba(14,21,38,.45);display:flex;align-items:flex-end;z-index:10}
  .overlay.center{align-items:center;padding:20px}
  .sheet{background:#fff;border-radius:26px 26px 0 0;padding:10px 18px 22px;width:100%;max-height:88%;overflow:auto;animation:up .25s ease-out}
  .sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .dlg{background:#fff;border-radius:26px;padding:22px;width:100%;max-height:90%;overflow:auto}
  .dlg h3,.sheet h3{font-family:var(--display);font-size:28px;font-weight:800;margin:0 0 10px;line-height:1}
  .fld label{font-size:13px;color:var(--mute);display:block;margin:12px 0 5px;font-weight:700}
  .fld input{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;font-weight:600}
  .acts{display:flex;gap:8px;margin-top:18px}
  .acts .cta{height:48px;font-size:16px}
  .err{color:var(--red);font-size:13px;margin-top:6px;font-weight:700}
  .video{background:var(--ink);border-radius:18px;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#fff;text-align:center;padding:16px;position:relative;overflow:hidden}
  .video .play{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center}
  .video .play .ico{width:28px;height:28px}
  .src{font-size:12.5px;color:var(--mute);font-weight:700;margin-top:8px;display:flex;justify-content:space-between;align-items:center}
  .src a{color:var(--ink)}

  /* mode séance */
  .player{position:absolute;inset:0;background:#fff;z-index:12;display:flex;flex-direction:column}
  .player .ph{display:flex;align-items:center;gap:10px;padding:44px 16px 8px}
  .player .prog{display:flex;gap:3px;flex:1}
  .player .prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
  .player .prog i.on{background:var(--flame)}
  .player .close{border:0;background:var(--chalk);width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .player .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 22px;text-align:center}
  .player .count{font-size:14px;font-weight:800;color:var(--mute)}
  .player .bigfig{height:210px;margin:6px 0 10px}
  .player h2{font-family:var(--display);font-size:38px;font-weight:800;margin:0;line-height:1}
  .player .amt{font-family:var(--display);font-size:72px;font-weight:800;line-height:1;margin-top:8px;font-variant-numeric:tabular-nums}
  .player .amt small{font-size:28px;color:var(--mute)}
  .player .foot{padding:16px 16px 26px;display:flex;flex-direction:column;gap:10px}
  .player.rest{background:var(--ink);color:#fff}
  .player.rest .count{color:#A9B6D3}
  .player.rest .close{background:var(--ink-2);color:#fff}
  .ring{width:190px;height:190px;position:relative;margin:10px 0}
  .ring svg{transform:rotate(-90deg)}
  .ring .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:64px;font-weight:800}
  .finish{position:absolute;inset:0;background:var(--ink);color:#fff;z-index:13;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:hidden}
  .finish .xp{font-family:var(--display);font-size:84px;font-weight:800;color:var(--volt);line-height:1}
  .finish p{font-size:16px;font-weight:700;margin:6px 0}
  .confetti{position:absolute;width:8px;height:14px;top:-20px;border-radius:2px;animation:fall 2.2s ease-in forwards}
  @keyframes fall{to{transform:translateY(820px) rotate(540deg);opacity:.8}}
  @media (prefers-reduced-motion: reduce){.confetti{display:none}.sheet{animation:none}}

  /* notification */
  .notif{position:absolute;top:40px;left:10px;right:10px;background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(14,21,38,.3);padding:12px 14px;z-index:20;cursor:pointer;transform:translateY(-260px);visibility:hidden;transition:transform .35s ease,visibility .35s}
  .notif.show{transform:translateY(0);visibility:visible}
  .notif .app{font-size:12px;color:var(--mute);font-weight:700}
  .notif .ti{font-weight:800;font-size:15px;margin-top:2px}
  .notif .tx{font-size:13.5px;margin-top:2px;font-weight:600}
  .toast{position:absolute;bottom:92px;left:14px;right:14px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px;line-height:1.4;z-index:26;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .toast button{color:var(--volt);background:none;border:0;font-weight:800;cursor:pointer;padding:0;margin-left:6px;text-decoration:underline}
  .lib.off .grow{opacity:.5;text-decoration:line-through}
  .goals{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;margin:0 16px 18px}
  .gcard{background:#fff;border-radius:18px;padding:12px;box-shadow:0 2px 0 var(--line);border:0;text-align:left;cursor:pointer;font-family:inherit;color:inherit}
  .gcard .gt{font-weight:800;font-size:14px;margin-bottom:6px}
  .chestrow{display:flex;align-items:center;gap:4px;margin-bottom:4px}
  .chestrow i,.chestprog i{width:14px;height:14px;border-radius:50%;background:var(--line);display:block}
  .chestrow i.on{background:var(--flame)}
  .ringw{display:flex;align-items:center;gap:8px;margin-bottom:2px}.ringw b{font-family:var(--display);font-size:26px}
  .mapov{position:absolute;inset:0;background:var(--ink);z-index:12;display:flex;flex-direction:column;color:#fff}
  .maphd{display:flex;align-items:center;gap:12px;padding:44px 16px 12px}
  .maphd .close{border:0;background:var(--ink-2);color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .mapsc{flex:1;overflow-y:auto}
  .mapin{position:relative;width:336px;margin:0 auto}
  .mappath{position:absolute;left:0;top:0}
  .node{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#2A3A60;border:3px solid #3B4C74;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:18px;color:#7D8BAE}
  .node.done{background:var(--flame);border-color:#FF9A5C;color:#fff}
  .node.chest{width:58px;height:58px;margin:-29px 0 0 -29px;background:#22325A;border-color:var(--volt)}
  .node.chest.done{background:#3B4C74}
  .node.here{box-shadow:0 0 0 5px rgba(255,107,26,.35)}
  .node .ico{width:22px;height:22px;color:#fff}
  .nlbl{position:absolute;transform:translateX(-50%);font-size:11.5px;font-weight:800;color:var(--volt);white-space:nowrap}
  .mapme{position:absolute;transform:translateX(-50%);animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}
  .blines{width:100%;max-width:270px;margin:8px 0 4px}
  .bl{display:flex;justify-content:space-between;font-weight:700;font-size:15px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.12);opacity:0;animation:blin .35s ease-out forwards}
  .bl b{color:var(--volt)}
  @keyframes blin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

function mascotSvg(kind, size = 120, mood = "happy", pose = "flex") {
  if (pose === "rest") mood = "sleep";
  const mouth = {
    happy: '<path d="M52 61 Q60 68 68 61" stroke="#2B2B2B" stroke-width="2.6" fill="none" stroke-linecap="round"/>',

    const AM = { flex: A.flexL + A.downR, wave: A.downL + A.waveR, point: A.downL + A.pointR, cheer: A.upL + A.upR, rest: "" };

  const jump = pose === "cheer" ? ' transform="translate(0,-6)"' : "";
  return `<svg viewBox="0 0 120 120" width="${size}" height="${size}" aria-label="Kiki le kangourou">

}

let AC = null;
function tone(f, t0, dur, type = "sine", vol = 0.18, f2 = null) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, AC.currentTime + t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, AC.currentTime + t0 + dur);
  g.gain.setValueAtTime(0.0001, AC.currentTime + t0);
  g.gain.exponentialRampToValueAtTime(vol, AC.currentTime + t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + t0 + dur);
  o.connect(g).connect(AC.destination); o.start(AC.currentTime + t0); o.stop(AC.currentTime + t0 + dur + 0.02);
}

const Game = {
  xpForLevel: l => 50 * (l - 1) * l,
  levelForXp(xp) { let l = 1; while (Game.xpForLevel(l + 1) <= xp) l++; return l; },
  levelProgress(xp) { const l = Game.levelForXp(xp), a = Game.xpForLevel(l), b = Game.xpForLevel(l + 1); return (xp - a) / (b - a); },
  levelTitle: l => l < 3 ? "Débutant" : l < 5 ? "Motivé" : l < 8 ? "Régulier" : l < 12 ? "Athlète" : l < 18 ? "Machine" : "Légende",
  done: e => P.profile.history.includes(e),
  /** Jours ratés depuis la dernière ouverture : un joker sauve un jour d'entraînement manqué. */
  refresh(today) {
    const p = P.profile, t = epochDay(today);
    const wk = weekOf(t);
    if (p.lastJokerRefillWeek !== wk) { if (p.lastJokerRefillWeek >= 0) p.jokers = Math.min(p.jokers + 1, 2); p.lastJokerRefillWeek = wk; }
    let used = 0, lost = false;
    const before = Game.streak(t - 1);
    for (let e = p.lastEval + 1; e < t; e++) {
      if (isTraining(e) && !Game.done(e)) {
        if (p.jokers > 0) { p.jokers--; p.jokerDays.push(e); used++; } else lost = true;
      }
    }
    p.lastEval = Math.max(p.lastEval, t - 1);
    return { used, lost: lost && before > 0 ? before : 0 };
  },
  /** Série : jours consécutifs « tenus » (séance faite, jour de repos prévu ou joker), depuis la 1re séance. */
  streak(t) {
    const p = P.profile;
    if (!p.history.length) return 0;
    const first = Math.min(...p.history);
    let n = 0;
    if (Game.done(t) || (!isTraining(t) && t >= first)) n++;
    for (let e = t - 1; e >= first; e--) {
      if (Game.done(e) || !isTraining(e) || p.jokerDays.includes(e)) n++; else break;
    }
    return n;
  },
  workoutFor(day, mini) {
    const e = epochDay(day), level = Game.levelForXp(P.profile.xp);
    const plan = planFor(e), type = plan ? plan.key : null;
    if (!type) return { type: null, name: "Récupération active", rounds: 1, minutes: 6, exercises: MOBILITY.slice(0, 4).map((m, i) => ({ ...m, muscle: null, key: "mob" + i })), maxDiff: 1, muscles: [] };
    const g = GOALS[P.goal];
    const maxDiff = g.maxDiff(level);
    const withEq = EXERCISES.filter(x => x.eq === "B" || P.settings.dumbbells);
    const all = withEq.filter(x => !P.disliked.includes(x.name));      // exercices écartés par l'utilisateur
    const ok = all.filter(x => x.diff <= maxDiff);
    let seed = (e * 2654435761) >>> 0;
    const rnd = () => { seed = (seed + 0x6D2B79F5) >>> 0; let t = seed; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const pickFrom = arr => arr[Math.floor(rnd() * arr.length)];
    let slots = plan.slots.map(s => [...s]);
    if (mini) slots = slots.slice(0, 4);
    const used = new Set(), picked = [];
    for (const slot of slots) {
      const muscle = pickFrom(slot);
      let cands = ok.filter(x => x.muscle === muscle && !used.has(x.name));
      if (!cands.length) cands = all.filter(x => x.muscle === muscle && !used.has(x.name)).sort((a, b) => a.diff - b.diff).slice(0, 1);
      if (!cands.length) cands = withEq.filter(x => x.muscle === muscle && !used.has(x.name)).slice(0, 1);  // dernier recours
      if (!cands.length) continue;
      const x = pickFrom(cands); used.add(x.name); picked.push(x);
    }
    const scale = g.scale * (1 + (level - 1) * 0.1);
    const rounds = mini ? 2 : g.rounds(level);
    const exercises = picked.map((x, i) => {
      const v = Math.max(x.sec ? 10 : 4, Math.round(x.base * scale / (x.sec ? 5 : 1)) * (x.sec ? 5 : 1));
      return { name: x.name, en: x.en, muscle: x.muscle, eq: x.eq, diff: x.diff, sec: x.sec ? v : 0, amount: x.sec ? `${v} s${x.suf}` : `${v}${x.suf}`, key: x.name };
    });
    return { type, name: plan.name, rounds, exercises, minutes: mini ? 15 : Math.round(rounds * exercises.length * 1.1 + 2), maxDiff, muscles: [...new Set(picked.map(x => x.muscle))] };
  },
  /** Dernière séance prévue avant aujourd'hui ratée (sans joker) ? -> message bienveillant + bonus de retour */
  comeback(t) {

  },
  weekCount(t) { const w = weekOf(t); return P.profile.trainDays.filter(e => weekOf(e) === w).length; },
  complete(day, mini) {
    const p = P.profile, e = epochDay(day), already = Game.done(e), rest = !isTraining(e);

    const st = Game.streak(e);

      lines.push([mini ? "Mini séance" : "Séance complète", mini ? 30 : 50]);

      if (back) lines.push(["Retour en force", 20]);

  },
};

}

// ------------------------------------------------ visite guidée de l'appli
const TOUR = [
  { sel: ".streak", mood: "happy", text: "Ta série : les jours où tu as tenu ton programme. Le repos compte aussi." },
  { sel: ".pills", mood: "happy", text: "Chaque séance rapporte des XP. Un joker par semaine sauve ta série si tu rates un jour." },
  { sel: ".week", mood: "happy", text: "Cercle plein : jour d'entraînement. Pointillés : repos." },
  { sel: ".seg", mood: "happy", text: "Pas le temps ? La mini séance de 15 minutes compte aussi." },
  { sel: ".exr", mood: "happy", text: "Touche un exercice pour voir sa démo." },
  { sel: "[data-tab='1']", mood: "happy", text: "Ici, tes jours d'entraînement et les muscles que tu travailles." },
  { sel: "[data-tab='2']", mood: "happy", text: "Dis-moi quand tu es occupé : je ne te dérangerai pas." },
  { sel: null, mood: "cheer", text: "C'est parti ! Je te fais signe au bon moment." },
];
function positionTour() {
  const layer = document.getElementById("tour");
  if (S.tour == null || !P.onboarded) { layer.hidden = true; layer.innerHTML = ""; return; }
  // étapes sans élément visible (ex. pas de mini séance un jour de repos) : on les saute
  while (S.tour < TOUR.length - 1 && TOUR[S.tour].sel && !screen.querySelector(TOUR[S.tour].sel)) S.tour++;
  const step = TOUR[S.tour];
  const first = layer.hidden || !layer.firstChild;
  layer.hidden = false;
  if (!layer.firstChild) layer.innerHTML = `<div class="spot none"></div><div class="tgrp"><div class="tm"></div><div class="tb"><div class="tt"></div><div class="tnav"><button class="lnk" data-tour="skip" style="color:var(--mute)">Passer</button><span class="tc"></span><button class="cta" data-tour="next"></button></div></div></div>`;
  const spot = layer.querySelector(".spot"), grp = layer.querySelector(".tgrp");
  const L = layer.getBoundingClientRect(), W = L.width, H = L.height;
  const el = step.sel ? screen.querySelector(step.sel) : null;
  let r = null;
  if (el) {
    const c = document.getElementById("content");
    if (c && c.contains(el)) {
      const er = el.getBoundingClientRect(), cr = c.getBoundingClientRect();
      if (er.top < cr.top + 20 || er.bottom > cr.bottom - 20) c.scrollTop += er.top - cr.top - Math.max(20, (cr.height - er.height) / 3);
    }
    const b = el.getBoundingClientRect();
    r = { x: b.left - L.left - 6, y: b.top - L.top - 6, w: b.width + 12, h: b.height + 12 };
    Object.assign(spot.style, { left: r.x + "px", top: r.y + "px", width: r.w + "px", height: r.h + "px" });
    spot.classList.remove("none");
  } else {
    Object.assign(spot.style, { left: W / 2 + "px", top: H / 2 + "px", width: "0px", height: "0px" });
    spot.classList.add("none");
  }
  const rev = r ? (r.x + r.w / 2) < W / 2 : false;   // la mascotte se place du côté opposé et se tourne vers la zone
  grp.classList.toggle("rev", rev);
  const tm = grp.querySelector(".tm");
  tm.innerHTML = mascot(84, step.mood, step.sel ? "point" : "cheer");
  tm.classList.remove("hop"); void tm.offsetWidth; tm.classList.add("hop");
  grp.querySelector(".tt").textContent = step.text;
  grp.querySelector(".tc").textContent = `${S.tour + 1} / ${TOUR.length}`;
  const last = S.tour === TOUR.length - 1;
  grp.querySelector("[data-tour=next]").textContent = last ? "C'est parti" : "Suivant";
  grp.querySelector("[data-tour=skip]").style.visibility = last ? "hidden" : "visible";
  const gh = grp.offsetHeight;
  let top;
  if (!r) top = (H - gh) / 2;
  else if (r.y + r.h + gh + 14 < H - 8) top = r.y + r.h + 10;
  else if (r.y - gh - 10 > 40) top = r.y - gh - 10;
  else top = H - gh - 90;
  if (first) { grp.style.transition = "none"; grp.style.top = top + "px"; void grp.offsetWidth; grp.style.transition = ""; }
  else grp.style.top = top + "px";
}
document.getElementById("tour").addEventListener("click", e => {
  const b = e.target.closest("[data-tour]"); if (!b) return;
  if (b.dataset.tour === "skip" || S.tour >= TOUR.length - 1) { S.tour = null; log("Visite guidée terminée"); save(); }
  else S.tour++;
  positionTour();
});

const chestIcon = (sz, open = false) => `<svg width="${sz}" height="${sz}" viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="13" width="24" height="15" rx="3" fill="#C9772B"/><path d="M4 ${open ? 9 : 13} Q16 ${open ? 0 : 4} 28 ${open ? 9 : 13} L28 ${open ? 11 : 15} L4 ${open ? 11 : 15} Z" fill="#E08E3A"/><rect x="4" y="17" width="24" height="3" fill="#8A4F1A"/><rect x="13.5" y="15" width="5" height="7" rx="1.5" fill="#FFC93C"/>${open ? '<path d="M10 6 l-2-3 M16 4 v-3 M22 6 l2-3" stroke="#FFC93C" stroke-width="2" stroke-linecap="round"/>' : ""}</svg>`;
function ringSvg(frac) { const c = 2 * Math.PI * 15; return `<svg width="44" height="44" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" stroke="var(--line)" stroke-width="4" fill="none"/><circle cx="18" cy="18" r="15" stroke="var(--mint)" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="${(c * frac).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 18 18)"/></svg>`; }
function mapView() {
  if (!S.map) return "";
  const p = P.profile, cur = p.steps, total = Math.max(30, Math.ceil((cur + 8) / 5) * 5);
  const W = 336, gap = 86, H = (total + 1) * gap + 120;
  const pos = i => ({ x: W / 2 + Math.sin(i * 0.9) * 105, y: H - 70 - i * gap });
  let path = ""; for (let i = 0; i <= total; i++) { const q = pos(i); path += (i ? " L" : "M") + q.x.toFixed(1) + " " + q.y.toFixed(1); }
  const nodes = [];
  for (let i = 0; i <= total; i++) {
    const q = pos(i), chest = i > 0 && i % 5 === 0, done = i <= cur, here = i === cur;
    const ci = i / 5 - 1, opened = chest && ci < p.chestsOpened;
    nodes.push(`<div class="node ${done ? "done" : ""} ${chest ? "chest" : ""} ${here ? "here" : ""}" style="left:${q.x}px;top:${q.y}px">${chest ? chestIcon(34, opened) : i === 0 ? ico("flame", "fill") : `<span>${i}</span>`}</div>`);
    if (chest) nodes.push(`<div class="nlbl" style="left:${q.x}px;top:${q.y + 30}px">${opened ? "Ouvert" : esc(rewardLabel(rewardFor(ci)))}</div>`);
  }
  const me = pos(cur);
  return `<div class="mapov"><div class="maphd"><button class="close" data-act="closeMap" aria-label="Fermer">${ico("x")}</button><div class="grow"><b>Mon parcours</b><div class="small" style="color:#A9B6D3">Une marche par séance · un coffre toutes les 5</div></div></div>
    <div class="mapsc" id="mapsc"><div class="mapin" style="height:${H}px">
      <svg class="mappath" width="${W}" height="${H}"><path d="${path}" stroke="#2A3A60" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="${path}" stroke="#3B4C74" stroke-width="3" stroke-dasharray="2 10" fill="none" stroke-linecap="round"/></svg>
      ${nodes.join("")}
      <div class="mapme" style="left:${me.x}px;top:${me.y - 62}px">${mascot(64, "happy", "wave")}</div>
    </div></div></div>`;
}
function chestView() {
  const c = S.chest; if (!c) return "";
  const r = rewardFor(c.index);
  return `<div class="finish" style="z-index:14">
    ${c.opened ? `<div style="font-size:0">${chestIcon(96, true)}</div><div class="xp" style="font-size:44px;margin-top:6px">${esc(rewardLabel(r))}</div>
      ${r.item ? `<div>${mascot(140, "cheer", "cheer")}</div><p>${coach().name} le porte déjà. Tu peux le retirer dans Profil.</p>` : `<p>${r.joker ? `Tu as maintenant ${P.profile.jokers} jokers.` : "Ajouté à ton total."}</p>`}
      <button class="cta" style="margin-top:16px;max-width:280px" data-act="closeChest">Super</button>`
    : `<p style="opacity:.8">Coffre ${c.index + 1}</p><button class="chestbtn" data-act="openChest" aria-label="Ouvrir le coffre">${chestIcon(130)}</button><p>Touche le coffre pour l'ouvrir</p>`}
  </div>`;
}

  const x = S.sheet; if (!x) return "";
  return `<div class="overlay" data-bg="1"><div class="sheet">
    <div class="grab"></div>
    <h3>${esc(x.name)}</h3>
    <div class="small" style="margin:-4px 0 10px">${x.muscle ? esc(muscleName(x.muscle)) : "Mobilité"}${x.amount ? " · " + esc(x.amount) : ""}</div>
    ${APP ? `<button class="video" data-act="nativeDemo" style="border:0;width:100%;cursor:pointer;font-family:inherit"><div class="play">${ico("play", "fill")}</div><div style="font-weight:800;font-size:16px">Voir la démo vidéo</div><div style="font-size:12.5px;opacity:.75">S'ouvre ici, sans quitter SportXP</div></button>` : `<div class="video">
      <div class="play">${ico("play", "fill")}</div>
      <div style="font-weight:700;font-size:14px;line-height:1.4">Dans l'appli, la vidéo MuscleWiki de cet exercice se lit ici, sans quitter SportXP.</div>
      <div style="font-size:12px;opacity:.7">La simulation ne peut pas charger de vidéo externe.</div>
    </div>`}
    <div class="src"><span>Vidéo : MuscleWiki</span><a href="${demoUrl(x.en)}" target="_blank" rel="noopener">Voir sur MuscleWiki</a></div>
    ${x.muscle ? `<div class="row" style="margin-top:14px"><div style="width:60px">${miniBody(x.muscle, 100)}</div><div class="grow small" style="line-height:1.5">Muscle travaillé : <b style="color:var(--ink)">${esc(muscleName(x.muscle))}</b>${x.diff ? `<br>Difficulté ${diffBars(x.diff)}` : ""}</div></div>` : ""}
    ${x.muscle ? `<button class="cta ghost" style="margin-top:14px" data-act="dislike">${ico("x")}Je n'aime pas cet exercice</button>` : ""}
    <button class="cta ghost" style="margin-top:10px" data-act="closeSheet">Fermer</button>
  </div></div>`;
}
function dialogView() {
  const d = S.dialog; if (!d) return "";
  if (d.kind === "confirmReset") return `<div class="overlay center"><div class="dlg"><h3>Tout recommencer ?</h3><p style="font-weight:600;line-height:1.45">Ta série, tes XP, tes coffres et tes réglages seront effacés. Impossible de revenir en arrière.</p><div class="acts"><button class="cta ghost" data-act="closeDlg">Annuler</button><button class="cta" style="background:var(--red);box-shadow:0 4px 0 #A9282D" data-act="confirmReset">Tout effacer</button></div></div></div>`;
  if (d.kind === "info") return `<div class="overlay center"><div class="dlg" style="text-align:center"><div>${mascot(100, "happy", "wave")}</div><p style="font-size:16px;font-weight:700;line-height:1.45">${esc(d.text)}</p><button class="cta" data-act="closeDlg">D'accord</button></div></div>`;
  if (d.kind === "rec") {
    const ok = d.days.length > 0 && d.end > d.start;
    return `<div class="overlay"><div class="sheet fld"><div class="grab"></div><h3>Indisponible le ${d.dayName.toLowerCase()}</h3>
      <div class="row"><div class="grow"><label>De</label><input type="time" id="dStart" value="${fmtMin(d.start)}"></div><div class="grow"><label>À</label><input type="time" id="dEnd" value="${fmtMin(d.end)}"></div></div>
      <label>Raison (facultatif)</label><input type="text" id="dLabel" value="${esc(d.label)}" placeholder="Travail, cours, sport…">
      <label>Répéter aussi le</label><div class="daybtns">${DAY_LETTERS.map((L, i) => `<button class="${d.days.includes(i + 1) ? "on" : ""}" data-day="${i + 1}" aria-label="${DAYS_FULL[i]}">${L}</button>`).join("")}</div>
      ${d.end > d.start ? "" : `<div class="err">L'heure de fin doit être après le début.</div>`}
      <div class="acts"><button class="cta ghost" data-act="cancel">Annuler</button><button class="cta" data-act="saveRec" ${ok ? "" : "disabled"}>Enregistrer</button></div></div></div>`;
  }
  const ok = d.end > d.start;
  return `<div class="overlay"><div class="sheet fld"><div class="grab"></div><h3>Indisponibilité ponctuelle</h3>
    <label>Date</label><input type="date" id="dDate" value="${d.date}">
    <div class="row"><div class="grow"><label>De</label><input type="time" id="dStart" value="${fmtMin(d.start)}"></div><div class="grow"><label>À</label><input type="time" id="dEnd" value="${fmtMin(d.end)}"></div></div>
    <label>Raison (facultatif)</label><input type="text" id="dLabel" value="${esc(d.label)}" placeholder="Rendez-vous, sortie…">
    ${ok ? "" : `<div class="err">L'heure de fin doit être après le début.</div>`}
    <div class="acts"><button class="cta ghost" data-act="cancel">Annuler</button><button class="cta" data-act="saveOne" ${ok ? "" : "disabled"}>Enregistrer</button></div></div></div>`;
}

// ------------------------------------------------ mode séance
let tick = null;
function startPlayer() {
  const w = Game.workoutFor(startOfDay(S.now), S.mini);
  const steps = [];
  for (let r = 0; r < w.rounds; r++) w.exercises.forEach((x, i) => steps.push({ x, r, i }));
  S.player = { w, steps, k: 0, phase: "work", left: null, running: false, mini: S.mini };
  render();
}
function playerView() {
  const pl = S.player; if (!pl) return "";
  const { w, steps, k } = pl, s = steps[k];
  const prog = `<div class="prog">${steps.map((_, i) => `<i class="${i < k || (i === k && pl.phase === "rest") ? "on" : ""}"></i>`).join("")}</div>`;
  if (pl.phase === "rest") {
    const nx = steps[k + 1].x, total = 30, left = pl.left ?? total, frac = left / total;
    return `<div class="player rest"><div class="ph"><button class="close" data-act="quit" aria-label="Quitter">${ico("x")}</button>${prog}</div>
      <div class="body"><div class="count">Récupération</div>
        <div class="ring"><svg viewBox="0 0 100 100" width="190" height="190"><circle cx="50" cy="50" r="44" stroke="#2A3A60" stroke-width="8" fill="none"/><circle cx="50" cy="50" r="44" stroke="#FFC93C" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="${(276.5 * frac).toFixed(1)} 276.5"/></svg><div class="v">${left}</div></div>
        <div class="count">Ensuite</div><h2 style="font-size:30px;margin-top:4px">${esc(nx.name)}</h2><div class="count" style="margin-top:4px">${esc(nx.amount)}</div></div>
      <div class="foot"><button class="cta" data-act="skipRest">Passer le repos</button></div></div>`;
  }
  const x = s.x, timed = x.sec > 0, left = pl.left ?? x.sec;
  return `<div class="player"><div class="ph"><button class="close" data-act="quit" aria-label="Quitter">${ico("x")}</button>${prog}</div>
    <div class="body">
      <div class="count">Exercice ${s.i + 1} sur ${w.exercises.length}${w.rounds > 1 ? ` · tour ${s.r + 1} sur ${w.rounds}` : ""}</div>
      ${cheerLine(pl) ? `<div class="pcheer">${cheerLine(pl)}</div>` : ""}
      <div class="bigfig">${x.muscle ? miniBody(x.muscle, 210) : mascot(190, "happy", "rest")}</div>
      <h2>${esc(x.name)}</h2>
      <div class="amt">${timed ? `${left}<small> s</small>` : esc(x.amount.split(" ")[0])}${!timed && x.amount.includes(" ") ? `<small> ${esc(x.amount.split(" ").slice(1).join(" "))}</small>` : ""}</div>
      ${timed && x.amount.includes("par") ? `<div class="count">${esc(x.amount.replace(/^\d+ s/, "").trim())}</div>` : ""}
      <div class="row" style="gap:18px;margin-top:14px"><button class="lnk" data-pdemo="1">Voir la démo</button>${x.muscle ? `<button class="lnk" data-act="dislikeP" style="color:var(--mute)">Je n'aime pas</button>` : ""}</div>
    </div>
    <div class="foot">${timed && !pl.running && left === x.sec ? `<button class="cta" data-act="startTimer">${ico("timer")}Lancer le chrono</button>` : `<button class="cta" data-act="doneStep">${ico("check")}${k === steps.length - 1 ? "Terminer" : "C'est fait"}</button>`}</div></div>`;
}
function cheerLine(pl) {
  const k = pl.k, n = pl.steps.length, s = pl.steps[k], w = pl.w;
  if (k === n - 1) return "Dernier exercice. Donne tout !";
  if (w.rounds > 1 && s.r === w.rounds - 1 && s.i === 0) return "Dernier tour !";
  if (k === Math.floor(n / 2)) return "Déjà la moitié. Continue comme ça.";
  if (k === 0) return "C'est parti. Le plus dur, c'était de commencer.";
  return "";
}
function stopTick() { clearInterval(tick); tick = null; }
function runTick(onEnd) {
  stopTick();
  tick = setInterval(() => {
    if (!S.player) return stopTick();
    S.player.left--; S.keepScroll = true;
    if (S.player.left <= 3 && S.player.left > 0) sfx("beep");
    if (S.player.left <= 0) { stopTick(); sfx("go"); onEnd(); } else render();
  }, 1000);
}
function nextStep() {
  const pl = S.player;
  if (pl.k >= pl.steps.length - 1) return finishWorkout();
  pl.phase = "rest"; pl.left = 30; pl.running = true; render();
  runTick(() => { pl.phase = "work"; pl.k++; pl.left = null; pl.running = false; render(); });
}
function finishWorkout() {
  stopTick(); 
  const mini = S.player.mini, rest = !S.player.w.type;
  S.player = null;
  const r = Game.complete(startOfDay(S.now), mini);
  log(`${rest ? "Récupération" : mini ? "Mini séance" : "Séance"} terminée : +${r.gained} XP${r.leveledUp ? `, niveau ${r.level}` : ""}`);
  S.finish = r; reschedule(); save(); render();
}
function finishView() {
  const r = S.finish; if (!r) return "";
  const colors = ["#FF6B1A", "#FFC93C", "#22B573", "#7FB2FF", "#fff"];
  const conf = Array.from({ length: 40 }, (_, i) => `<i class="confetti" style="left:${(i * 37) % 100}%;background:${colors[i % 5]};animation-delay:${(i % 10) * 0.08}s"></i>`).join("");
  const p = P.profile, toChest = r.chest != null ? 0 : 5 - (p.steps % 5);
  return `<div class="finish">${conf}
    <div>${mascot(130, "cheer", "cheer")}</div>
    <div class="xp" id="xpCount">+0 XP</div>
    <div class="blines">${r.lines.map((l, i) => `<div class="bl" style="animation-delay:${0.15 + i * 0.25}s"><span>${esc(l[0])}</span><b>+${l[1]}</b></div>`).join("")}</div>
    ${r.leveledUp ? `<div class="lvup">Niveau ${r.level} : ${Game.levelTitle(r.level)}</div>` : ""}
    <div class="chestprog">${Array.from({ length: 5 }, (_, i) => `<i class="${r.chest != null || i < p.steps % 5 ? "on" : ""}"></i>`).join("")}${chestIcon(30, r.chest != null)}</div>
    <p style="opacity:.85;font-size:14px;margin-top:2px">${r.chest != null ? "Coffre débloqué !" : toChest === 1 ? "Plus qu'une séance avant le coffre" : `Encore ${toChest} séances avant le coffre`}</p>
    <button class="cta" style="margin-top:14px;max-width:280px" data-act="${r.chest != null ? "toChest" : "closeFinish"}">${r.chest != null ? "Ouvrir le coffre" : "Continuer"}</button></div>`;
}
function animateFinish() {
  const el = document.getElementById("xpCount"); if (!el || !S.finish || S.finish.animated) return;
  const r = S.finish; r.animated = true;
  sfx("win");
  const total = r.gained, t0 = performance.now(), dur = 900 + r.lines.length * 250;
  let last = 0;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), v = Math.round(total * (1 - Math.pow(1 - k, 3)));
    const e2 = document.getElementById("xpCount"); if (!e2) return;
    e2.textContent = `+${v} XP`;
    if (v !== last && v % 5 === 0) sfx("tick"); last = v;
    if (k < 1) requestAnimationFrame(step); else if (r.leveledUp) setTimeout(() => sfx("level"), 150);
  };
  requestAnimationFrame(step);
}

let notifTimer;
function showNotif(n) {
  S.notif = n; S.keepScroll = true; render();
  clearTimeout(notifTimer); notifTimer = setTimeout(() => { S.notif = null; const el = document.getElementById("notif"); if (el) el.classList.remove("show"); }, 7000);
}

// =============================================================== événements
function readDialogInputs() {
  const d = S.dialog; if (!d) return; const q = id => document.getElementById(id);
  if (q("dLabel")) d.label = q("dLabel").value;
  if (q("dStart")) d.start = toMin(q("dStart").value);
  if (q("dEnd")) d.end = toMin(q("dEnd").value);
  if (q("dDate")) d.date = q("dDate").value;
}
screen.addEventListener("change", e => {
  const id = e.target.id;
  if (["dStart", "dEnd", "dDate"].includes(id)) { readDialogInputs(); S.keepScroll = true; render(); }
  if (id === "ws" || id === "we") {
    const ws = toMin(document.getElementById("ws").value), we = toMin(document.getElementById("we").value);
    if (we > ws) { P.settings.windowStartMin = ws; P.settings.windowEndMin = we; reschedule(); save(); }
    S.keepScroll = true; render();
  }
});
screen.addEventListener("input", e => { if (e.target.id === "dLabel" && S.dialog) S.dialog.label = e.target.value; });
screen.addEventListener("click", e => {
  if (e.target.closest("a")) return;
  if (e.target.matches("[data-bg]")) { S.sheet = null; S.keepScroll = true; return render(); }
  const t = e.target.closest("[data-tab],[data-mini],[data-act],[data-demo],[data-libdemo],[data-pdemo],[data-view],[data-muscle],[data-mascot],[data-sex],[data-goal],[data-tday],[data-addday],[data-delslot],[data-delone],[data-rep],[data-day],[data-undis],[data-equip],#notif");
  if (!t) return;
  const ds = t.dataset; S.keepScroll = true;
  if (ds.act === "start" || ds.act === "obNext" || ds.tab) sfx("tap");
  const touch = () => { save(); render(); };
  if (t.id === "notif") { S.notif = null; S.tab = 0; S.keepScroll = false; return render(); }
  if (ds.tab) { S.tab = +ds.tab; S.keepScroll = false; return render(); }
  if (ds.mini) { S.mini = ds.mini === "1"; return render(); }
  if (ds.demo) { S.sheet = Game.workoutFor(startOfDay(S.now), S.mini).exercises[+ds.demo]; return render(); }
  if (ds.libdemo) { const [n, m] = ds.libdemo.split("|"); const x = EXERCISES.find(z => z.name === n && z.muscle === m); S.sheet = { name: x.name, en: x.en, muscle: x.muscle, diff: x.diff }; return render(); }
  if (ds.pdemo) { const pl = S.player; S.sheet = pl.steps[pl.k].x; return render(); }
  if (ds.view) { S.view = ds.view; return render(); }
  if (ds.equip) { const it = ds.equip, q = P.profile.equipped; P.profile.equipped = q.includes(it) ? q.filter(x => x !== it) : [...q, it]; sfx("tap"); return touch(); }
  if (ds.undis) { P.disliked = P.disliked.filter(z => z !== ds.undis); log(`« ${esc(ds.undis)} » remis dans tes exercices`); return touch(); }
  if (ds.muscle) { const m = ds.muscle; P.priority = P.priority.includes(m) ? P.priority.filter(x => x !== m) : [...P.priority, m]; return touch(); }
  if (ds.mascot) { P.mascot = ds.mascot; return touch(); }
  if (ds.sex) { P.sex = ds.sex; return touch(); }
  if (ds.goal) { P.goal = ds.goal; if (!P.onboarded) P.days = [...GOALS[ds.goal].days]; return touch(); }
  if (ds.tday) { const d = +ds.tday; P.days = P.days.includes(d) ? P.days.filter(x => x !== d) : [...P.days, d].sort(); if (P.onboarded) reschedule(); return touch(); }
  if (ds.addday) { const d = +ds.addday; S.dialog = { kind: "rec", days: [d], dayName: DAYS_FULL[d - 1], label: "", start: 8 * 60, end: 12 * 60 }; return render(); }
  if (ds.day) { readDialogInputs(); const d = +ds.day, a = S.dialog.days; S.dialog.days = a.includes(d) ? a.filter(x => x !== d) : [...a, d]; return render(); }
  if (ds.delslot) { const id = +ds.delslot, d = +ds.dday; P.recurring = P.recurring.map(b => b.id === id ? { ...b, days: b.days.filter(x => x !== d) } : b).filter(b => b.days.length); reschedule(); return touch(); }
  if (ds.delone) { P.oneOff = P.oneOff.filter(b => b.id != ds.delone); reschedule(); return touch(); }
  if (ds.rep) { P.settings.repeatEveryMin = +ds.rep; reschedule(); return touch(); }
  switch (ds.act) {
    case "start": startPlayer(); break;
    case "startTimer": { const pl = S.player; pl.running = true; pl.left = pl.steps[pl.k].x.sec; render(); runTick(() => { pl.running = false; nextStep(); }); break; }
    case "doneStep": stopTick(); sfx("step"); nextStep(); break;
    case "skipRest": { stopTick(); const pl = S.player; pl.phase = "work"; pl.k++; pl.left = null; pl.running = false; render(); break; }
    case "quit": stopTick(); S.player = null; render(); break;
    case "closeFinish": S.finish = null; S.keepScroll = false; render(); break;
    case "toChest": S.chest = { index: S.finish.chest, opened: false }; S.finish = null; render(); break;
    case "openChest": {
      const c = S.chest, r = rewardFor(c.index), p = P.profile;
      if (r.item && !p.items.includes(r.item)) { p.items.push(r.item); p.equipped.push(r.item); }
      if (r.joker) p.jokers += r.joker;
      if (r.xp) p.xp += r.xp;
      p.chestsOpened = Math.max(p.chestsOpened, c.index + 1);
      c.opened = true; sfx("chest"); log(`Coffre ${c.index + 1} ouvert : ${esc(rewardLabel(r))}`); save(); render(); break; }
    case "closeChest": S.chest = null; render(); break;
    case "openMap": S.map = true; S.mapScroll = true; render(); break;
    case "closeMap": S.map = false; render(); break;
    case "tips": P.settings.tips = !P.settings.tips; reschedule(); touch(); break;
    case "sound": P.settings.sound = !P.settings.sound; touch(); if (P.settings.sound) sfx("step"); break;
    case "closeSheet": S.sheet = null; render(); break;
    case "closeDlg": S.dialog = null; render(); break;
    case "dumbbells": P.settings.dumbbells = !P.settings.dumbbells; touch(); break;
    case "vacation": P.settings.vacation = !P.settings.vacation; log(P.settings.vacation ? "Mode vacances activé" : "Mode vacances désactivé"); reschedule(); touch(); break;
    case "reminders": P.settings.remindersOn = !P.settings.remindersOn; reschedule(); touch(); break;
    case "nativeDemo": { const x = S.sheet; try { NATIVE && NATIVE.openDemo(demoUrl(x.en), x.name); } catch (er) {} break; }
    case "appSettings": try { NATIVE && NATIVE.openAppSettings(); } catch (er) {} break;
    case "autostart": try { NATIVE && NATIVE.openAutostart(); } catch (er) {} break;
    case "exactAlarm": try { NATIVE && NATIVE.requestExact(); } catch (er) {} break;
    case "test": if (NATIVE) { try { NATIVE.notify(`${coach().name} : test réussi`, "Les rappels fonctionnent. À toi de jouer !"); } catch (er) {} } else showNotif({ ti: `${coach().name} : test réussi`, tx: "Les rappels fonctionnent. À toi de jouer !", mood: "happy" }); break;
    case "obNext":
      if (P.obStep === 1 && P.obIntro < INTRO.length - 1) { S.introFrom = INTRO[P.obIntro].pos; P.obIntro++; S.keepScroll = false; touch(); break; }
      if (P.obStep === 0) { P.obIntro = 0; S.introFrom = null; }
      P.obStep = Math.min(5, P.obStep + 1); S.keepScroll = false; touch(); break;
    case "obBack":
      if (P.obStep === 1 && P.obIntro > 0) { S.introFrom = INTRO[P.obIntro].pos; P.obIntro--; touch(); break; }
      P.obStep = Math.max(0, P.obStep - 1); if (P.obStep === 1) P.obIntro = INTRO.length - 1; S.keepScroll = false; touch(); break;
    case "skipIntro": P.obStep = 2; S.keepScroll = false; touch(); break;
    case "resetAll": if (APP) { S.dialog = { kind: "confirmReset" }; render(); } else doReset(); break;
    case "confirmReset": S.dialog = null; doReset(); break;
    case "dislike": case "dislikeP": {
      const x = ds.act === "dislike" ? S.sheet : S.player.steps[S.player.k].x;
      dislike(x.name, x.muscle); break; }
    case "undoDislike": { const n = S.lastDisliked; P.disliked = P.disliked.filter(z => z !== n); S.toast = null; log(`« ${esc(n)} » remis dans tes exercices`); refreshPlayer(); touch(); break; }
    case "replayTour": S.tab = 0; S.tour = 0; S.keepScroll = false; render(); break;
    case "onboardDone": P.onboarded = true; S.tab = 0; S.keepScroll = false;
      log(`Profil : ${coach().full}, ${P.sex === "f" ? "femme" : "homme"}, ${GOALS[P.goal].name.toLowerCase()}, ${P.days.length} jours, ${P.priority.length ? "muscles : " + P.priority.map(muscleName).join(", ") : SPLITS[splitKey()].name}`);
      reschedule(); S.tour = 0; touch(); break;
    case "addone": { const h = S.now.getHours(); S.dialog = { kind: "one", label: "", date: isoDate(S.now), start: Math.min(h + 1, 22) * 60, end: Math.min(h + 3, 23) * 60 }; render(); break; }
    case "cancel": S.dialog = null; render(); break;
    case "saveRec": { readDialogInputs(); const d = S.dialog, base = Date.now();
      [...d.days].sort().forEach((day, i) => P.recurring.push({ id: base + i, days: [day], startMin: d.start, endMin: d.end, label: d.label.trim() }));
      log(`Indisponible ${daysLabel(d.days)} de ${fmtMin(d.start)} à ${fmtMin(d.end)}`); S.dialog = null; reschedule(); touch(); break; }
    case "saveOne": { readDialogInputs(); const d = S.dialog; const [y, m, dd] = d.date.split("-").map(Number); const b0 = new Date(y, m - 1, dd);
      P.oneOff.push({ id: Date.now(), start: addMin(b0, d.start).getTime(), end: addMin(b0, d.end).getTime(), label: d.label.trim() }); P.oneOff.sort((a, b) => a.start - b.start);
      log(`Indisponible le ${dayFmt(b0)} de ${fmtMin(d.start)} à ${fmtMin(d.end)}`); S.dialog = null; reschedule(); touch(); break; }
  }
});
document.querySelector(".panel")?.addEventListener("click", e => {
  const b = e.target.closest("[data-sim]"); if (!b) return;
  const v = b.dataset.sim, now = S.now;
  if (v === "60") advanceTo(addMin(now, 60));
  else if (v === "h18") { let t = addMin(startOfDay(now), 18 * 60); if (t <= now) t = new Date(t.getTime() + 86400000); advanceTo(t); }
  else if (v === "day") advanceTo(addMin(new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1), 9 * 60));
  else if (v === "week") advanceTo(new Date(now.getTime() + 7 * 86400000));
  else if (v === "next") { if (P.scheduled) advanceTo(new Date(P.scheduled)); else { log("Aucun rappel programmé"); save(); render(); } }
  else if (v === "reset") doReset();
});

let toastTimer;
function toast(html) { S.toast = html; clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; S.keepScroll = true; render(); }, 5000); }
function refreshPlayer() {
  const pl = S.player; if (!pl) return;
  const w = Game.workoutFor(startOfDay(S.now), pl.mini);
  pl.w = w; pl.steps = []; for (let r = 0; r < w.rounds; r++) w.exercises.forEach((x, i) => pl.steps.push({ x, r, i }));
  pl.k = Math.min(pl.k, pl.steps.length - 1); pl.left = null; pl.running = false; stopTick();
}
function dislike(name, muscle) {
  const before = Game.workoutFor(startOfDay(S.now), S.player ? S.player.mini : S.mini).exercises.map(z => z.name);
  if (!P.disliked.includes(name)) P.disliked.push(name);
  const after = Game.workoutFor(startOfDay(S.now), S.player ? S.player.mini : S.mini).exercises.map(z => z.name);
  const repl = after.find(n => !before.includes(n));
  S.lastDisliked = name; S.sheet = null;
  refreshPlayer();
  toast(`« ${esc(name)} » ne te sera plus proposé${repl ? `. Remplacé par « ${esc(repl)} »` : ""}.<button data-act="undoDislike">Annuler</button>`);
  log(`Exercice écarté : ${esc(name)}${repl ? ` → ${esc(repl)}` : ""}`);
  save(); S.keepScroll = true; render();
}
window.onBack = () => {
  if (S.tour != null) { S.tour = null; positionTour(); return true; }
  if (S.sheet) { S.sheet = null; render(); return true; }
  if (S.dialog) { S.dialog = null; render(); return true; }
  if (S.chest) { S.chest = null; render(); return true; }
  if (S.finish) { S.finish = null; render(); return true; }
  if (S.map) { S.map = false; render(); return true; }
  if (S.player) { stopTick(); S.player = null; render(); return true; }
  if (!P.onboarded && P.obStep > 0) { P.obStep--; save(); render(); return true; }
  if (P.onboarded && S.tab !== 0) { S.tab = 0; render(); return true; }
  return false;
};
window.onAppResume = () => { if (!S.player) { appRefresh(); save(); S.keepScroll = true; render(); } };
function doReset() {
  stopTick(); P = fresh();
  Object.assign(S, { map: false, chest: null, tour: null, introFrom: null, tab: 0, mini: false, view: "front", notif: null, dialog: null, sheet: null, player: null, finish: null });
  log("Simulation réinitialisée"); save(); render();
  document.getElementById("content").scrollTop = 0; window.scrollTo(0, 0);
}
if (!P.log.length) log("Appli ouverte pour la première fois");
appRefresh(); save(); render();
})();
</script>
